name: NYSApp
options:
  bundleIdPrefix: com.newyorksash
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

targets:
  NYSApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/NYSApp
    info:
      path: Sources/NYSApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: New York Sash
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSCameraUsageDescription: New York Sash uses your camera in the visualizer to preview window and siding styles on your home.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newyorksash.app
        PRODUCT_NAME: "New York Sash"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Supabase

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

schemes:
  NYSApp:
    build:
      targets:
        NYSApp: all
    run:
      config: Debug
    archive:
      config: Release
