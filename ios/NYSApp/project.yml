name: NYSApp

# XcodeGen is the source of truth for the project, matching the Vitaminly/Analogly
# scaffold convention. CI runs `xcodegen generate` before every build; the .xcodeproj
# is never committed.
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 64X5Z6TNJQ
    VERSIONING_SYSTEM: apple-generic
    # Project scope on purpose: this is where `agvtool new-version -all` writes.
    # Declaring these per-target shadows agvtool's value and pins every release build at 1.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  NYSApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/NYSApp
    info:
      path: Sources/NYSApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: New York Sash
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSCameraUsageDescription: New York Sash uses your camera in the visualizer to preview window and siding styles on your home.
        UIAppFonts:
          - Inter-Variable.ttf
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newyorksash.app
        PRODUCT_NAME: "New York Sash"
        # Set per-target because XcodeGen's built-in setting presets otherwise supply the
        # iOS default of "1,2" (iPhone + iPad) at target scope, overriding project scope.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - package: Supabase

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

schemes:
  NYSApp:
    build:
      targets:
        NYSApp: all
    run:
      config: Debug
    archive:
      config: Release
